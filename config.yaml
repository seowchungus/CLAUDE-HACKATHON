# ACCORD runtime configuration. Owner: MANAGER. Workers read, never edit.
# Changes go through MANAGER and are noted in .team/BOARD.md.

negotiation:
  MAX_ROUNDS: 3              # hard limit, enforced in agents/coordinator.py. Round MAX_ROUNDS is ballot-only.
  counters_allowed_rounds: [1, 2]
  call_timeout_s: 20
  schema_retries: 1          # 1 retry on schema failure; a 2nd failure counts as REJECT
  temperature: 0.2

models:
  # Verified listed on the free tier by W2-01 (12:03). gemini-3.8-flash timed out / 503 on every call
  # at 12:00, so negotiators run on the proposal's named backup 3.6 Flash (12:25, MANAGER).
  # Model parity kept: all three negotiators on the same model. Swap back with one line if 3.8 recovers.
  ATC: gemini-3.6-flash
  PILOT: gemini-3.6-flash
  GROUND: gemini-3.6-flash
  NARRATOR: gemini-flash-lite-latest
  backup: gemini-flash-lite-latest   # used on persistent 429/503
  ablation_B3: gemini-3.8-flash      # model ablation, only if it becomes responsive

rate_limit:
  backoff_initial_s: 2
  backoff_max_s: 30
  max_429_retries: 4

options:
  eta_shifts_min: [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60]
  fp_adjustments: [as_filed, speed_reduction, hold_10, hold_20, reroute_weather]
  n_candidates_min: 6
  n_candidates_max: 8

thresholds:
  fuel_final_reserve_min: 30         # H3
  turbulence_severe: 0.7             # H7: turbulence_idx must be < this
  ramp_overtime_hard_cap_min: 60     # H5 hard cap; below cap is soft (costed)
  wake_separation_s:                 # H1 (leader -> follower). Illustrative, NOT ICAO.
    H-L: 180
    H-M: 120
    H-H: 90
    M-L: 90
    M-M: 60
    M-H: 60
    L-L: 60
    L-M: 60
    L-H: 60
  min_turnaround_min: 35
  aar_weather_factor:                # synthetic rule: reduced AAR = nominal * factor
    light: 0.85    # WEATHER_DELAY 16-30
    moderate: 0.7  # 31-60
    severe: 0.5    # > 60

fallback_weights:                    # J = sum(w * metric); shown in UI
  w_d_bank_delay_added: 1.0
  w_f_extra_fuel: 0.8
  w_c_misconnected_pax: 2.0
  w_o_ramp_overtime: 0.5
  w_t_turbulence: 20.0
  w_q_throughput_loss: 5.0

scenario:
  bank_window_min: 90
  connection_window_min: [30, 150]
  gates_per_airport: 12
  taxiways: [A, B, C, D]

paths:
  raw_dir: data/raw
  qualifying: data/qualifying.parquet
  runs_dir: runs
  eval_results: eval/results.json
  hero_cache_dir: api/hero_cache
